name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Generate assets
        run: python scripts/generate_assets.py

      - name: Cache bundled models
        uses: actions/cache@v4
        with:
          path: models
          key: models-small-${{ hashFiles('src/voicetype/models.py') }}

      - name: Download bundled model
        run: python scripts/fetch_models.py --models small

      - name: Build application
        run: pyinstaller --noconfirm --clean voicetype.spec

      - name: Verify the bundled DLL directories
        run: python scripts/check_bundle_libs.py dist/VoiceType/_internal

      - name: Bundle models next to the executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "dist\VoiceType\models" | Out-Null
          Copy-Item -Recurse -Force "models\small" "dist\VoiceType\models\small"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }
          if (-not $tag) { throw "A release tag is required" }
          $version = $tag.TrimStart("v")
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build installer
        shell: pwsh
        run: |
          iscc "/DMyAppVersion=${{ steps.version.outputs.version }}" installer\voicetype.iss

      - name: Write checksums
        shell: pwsh
        run: |
          Set-Location dist-installer
          Get-ChildItem -Filter *.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content -Path SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: VoiceType ${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            dist-installer/VoiceType-Setup-*.exe
            dist-installer/SHA256SUMS.txt
